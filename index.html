
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PT CONNECT Invitation</title>
  <style>
    body {
      margin: 0;
      background: #111315;
      color: #f3f4f6;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #272b30;
      border-radius: 20px;
      padding: 32px;
      max-width: 420px;
      margin: 20px;
      text-align: center;
    }
    h1 { font-size: 32px; }
    p { color: #c4c8ce; line-height: 1.6; }
    .code {
      overflow-wrap: anywhere;
      background: #111315;
      padding: 14px;
      border-radius: 10px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>PT CONNECT</h1>
    <h2>You're Invited!</h2>
    <p>
      Your personal trainer has invited you
      to join their training programme.
    </p>
    <p>Your invitation code:</p>
    <div class="code" id="inviteCode">Loading...</div>
    <p id="status"></p>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    document.getElementById("inviteCode").textContent =
      token || "No invitation code provided";

    document.getElementById("status").textContent =
      token
        ? "Invitation received. Programme acceptance is coming soon."
        : "Please open a valid invitation link.";
  </script>
</body>
</html>
